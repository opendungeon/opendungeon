services:
  postgres:
    image: postgres:latest
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file: .env

  s3:
    image: chrislusf/seaweedfs:latest
    ports:
      - 8333:8333 # S3
      - 9333:9333 # Master
      - 8888:8888 # filer
    entrypoint: weed
    command: "mini -dir=/var/s3/data -ip=localhost"
    volumes:
      - s3_data:/var/s3/data
      - s3_filer:/data
    env_file: .env

  valkey:
    image: valkey/valkey-bundle:latest
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data
    environment:
      VALKEY_EXTRA_FLAGS: "--user $VALKEY_USER on >$VALKEY_PASSWORD ~* &* +@all"
    env_file: .env

  valkey-admin:
    image: valkey/valkey-admin:latest
    ports:
      - 8001:8080
    environment:
      DEPLOYMENT_MODE: web
    profiles:
      - tools
    depends_on:
      - valkey

volumes:
  postgres_data:
  s3_data:
  s3_filer:
  valkey_data:
