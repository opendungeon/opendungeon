name: Lint

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Create Placeholder Manifests
        run: |
          mkdir -p src/lib/assets/manifests
          echo '{"asset": {"displayName":"","uri":""}}' | tee src/lib/assets/manifests/{celltextures,decorations}.json >/dev/null
      - name: Check
        run: bun check
      - name: Lint
        run: bun lint
