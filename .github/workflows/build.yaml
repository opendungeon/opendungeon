name: Build

on:
  push:
  pull_request:
    branches: [main]

env:
  MIGRATIONS_DIR: ./migrations

jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
