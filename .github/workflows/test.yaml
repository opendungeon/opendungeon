name: Test

on:
  push:
  pull_request:
    branches: [main]

env:
  MIGRATIONS_DIR: ./migrations

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Install Playwright
        run: bunx playwright install
      - name: Test
        run: bun run test
